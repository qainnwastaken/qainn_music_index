<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="google-site-verification"
    content="jBSjUxFDx4Ohv8eFuAyVb2vxxCi6LDB3L6YcFPpK9B8"
  />

  <meta
    name="description"
    content="Qainndex is a music rating, ranking and review site covering songs, artists, production, originality and standout musical moments."
  />

  <title>Qainndex — Music Ratings, Rankings & Reviews</title>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#home" aria-label="QAINN home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-copy"><strong>QAINN</strong><small>MUSIC INDEX</small></span>
    </a>
    <nav class="nav" id="mainNav" aria-label="Primary navigation">
      <a href="#home" data-nav="home">Home</a>
      <a href="#library" data-nav="library">Library</a>
      <a href="#leaderboard" data-nav="leaderboard">Leaderboard</a>
      <a href="#philosophy" data-nav="philosophy">Scoring</a>
      <a href="#challenges" data-nav="challenges">Challenges <span id="challengeCount" class="count-pill">0</span></a>
    </nav>
    <button id="menuButton" class="menu-button" aria-label="Open menu">☰</button>
  </header>

  <main id="app" class="app-shell"></main>

  <footer class="site-footer">
    <div><strong>QAINN</strong><span>Pop criticism for records with identity.</span></div>
    <div class="footer-right">Editorial scores stay editorial. Community challenges make the case.</div>
  </footer>

  <template id="songCardTemplate">
    <article class="song-card">
      <button class="song-card-link" type="button">
        <div class="cover-art"><span class="cover-initial"></span><span class="cover-score"></span></div>
        <div class="song-card-copy">
          <div class="song-card-topline"><span class="score-badge"></span><span class="tier-label"></span></div>
          <h3 class="song-title"></h3>
          <p class="song-artist"></p>
          <p class="song-release"></p>
        </div>
      </button>
    </article>
  </template>

  <script src="app.js" defer></script>
</body>
</html>

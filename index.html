<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="QAINN — pop and creative music criticism, scored for identity, production, originality, melody and unforgettable moments." />
  <title>QAINN — Music Index</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="noise"></div>
  <header class="site-header">
    <a class="brand" href="#home" aria-label="QAINN home">
      <span class="brand-mark">Q</span>
      <span class="brand-copy"><strong>QAINN</strong><small>MUSIC INDEX</small></span>
    </a>
    <nav class="nav" aria-label="Primary navigation">
      <a href="#home" data-nav="home">Home</a>
      <a href="#leaderboard" data-nav="leaderboard">Leaderboard</a>
      <a href="#philosophy" data-nav="philosophy">Scoring</a>
      <a href="#challenges" data-nav="challenges">Challenges <span id="challengeCount" class="count-pill">0</span></a>
    </nav>
    <button id="menuButton" class="menu-button" aria-label="Open menu">☰</button>
  </header>

  <main id="app" class="app-shell"></main>

  <footer class="site-footer">
    <div>
      <strong>QAINN</strong>
      <span>Pop criticism for records with identity.</span>
    </div>
    <div class="footer-right">Scores are editorial, challenges are public arguments.</div>
  </footer>

  <template id="songCardTemplate">
    <article class="song-card">
      <button class="song-card-link" type="button">
        <div class="cover-art"><span class="cover-initial"></span><span class="cover-score"></span></div>
        <div class="song-card-copy">
          <div class="song-card-topline"><span class="score-badge"></span><span class="tier-label"></span></div>
          <h3 class="song-title"></h3>
          <p class="song-artist"></p>
        </div>
      </button>
    </article>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
